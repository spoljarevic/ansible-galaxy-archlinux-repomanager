---
- name: Determine mirrorlist tier backing the selected CachyOS variant
  ansible.builtin.set_fact:
    archrepomanager_cachyos_mirrorlist_tier: >-
      {{ archrepomanager_cachyos_mirrorlist_map[archrepomanager_cachyos_variant] | default(archrepomanager_cachyos_variant) }}

- name: Install gnupg (provides dirmngr for keyserver access)
  ansible.builtin.pacman:
    name: gnupg
    state: present

- name: Fetch and import CachyOS signing key
  ansible.builtin.shell:
    cmd: curl -s "https://{{ archrepomanager_cachyos_keyserver }}/pks/lookup?op=get&search=0x{{ archrepomanager_cachyos_key }}" | pacman-key --add -
  changed_when: false

- name: Locally sign CachyOS key
  ansible.builtin.command:
    cmd: pacman-key --lsign-key {{ archrepomanager_cachyos_key }}
  changed_when: false

- name: Get latest cachyos-keyring package filename
  ansible.builtin.shell:
    cmd: >
      curl -s {{ archrepomanager_cachyos_mirror }}/
      | grep -oP 'cachyos-keyring-[^"]+\.pkg\.tar\.zst'
      | grep -v '\.sig'
      | tail -1
  register: archrepomanager_cachyos_keyring_pkg
  changed_when: false

- name: Get latest cachyos-mirrorlist package filename
  ansible.builtin.shell:
    cmd: >
      curl -s {{ archrepomanager_cachyos_mirror }}/
      | grep -oP 'cachyos-mirrorlist-[^"]+\.pkg\.tar\.zst'
      | grep -v '\.sig'
      | tail -1
  register: archrepomanager_cachyos_mirrorlist_pkg
  changed_when: false

- name: Get latest cachyos-{{ archrepomanager_cachyos_mirrorlist_tier }}-mirrorlist package filename
  ansible.builtin.shell:
    cmd: >
      curl -s {{ archrepomanager_cachyos_mirror }}/
      | grep -oP 'cachyos-{{ archrepomanager_cachyos_mirrorlist_tier }}-mirrorlist-[^"]+\.pkg\.tar\.zst'
      | grep -v '\.sig'
      | tail -1
  register: archrepomanager_cachyos_variant_mirrorlist_pkg
  changed_when: false
  when: archrepomanager_cachyos_variant | length > 0

- name: Remove stale pacman lock if present
  ansible.builtin.file:
    path: /var/lib/pacman/db.lck
    state: absent

- name: Install cachyos-keyring
  ansible.builtin.command:
    cmd: pacman -U --noconfirm {{ archrepomanager_cachyos_mirror }}/{{ archrepomanager_cachyos_keyring_pkg.stdout }}
  args:
    creates: /usr/share/pacman/keyrings/cachyos.gpg

- name: Install cachyos-mirrorlist
  ansible.builtin.command:
    cmd: pacman -U --noconfirm {{ archrepomanager_cachyos_mirror }}/{{ archrepomanager_cachyos_mirrorlist_pkg.stdout }}
  args:
    creates: /etc/pacman.d/cachyos-mirrorlist

- name: Install cachyos-{{ archrepomanager_cachyos_mirrorlist_tier }}-mirrorlist
  ansible.builtin.command:
    cmd: pacman -U --noconfirm {{ archrepomanager_cachyos_mirror }}/{{ archrepomanager_cachyos_variant_mirrorlist_pkg.stdout }}
  args:
    creates: /etc/pacman.d/cachyos-{{ archrepomanager_cachyos_mirrorlist_tier }}-mirrorlist
  when: archrepomanager_cachyos_variant | length > 0

- name: Add CachyOS repos to pacman.conf
  ansible.builtin.blockinfile:
    path: /etc/pacman.conf
    marker: "# {mark} ANSIBLE MANAGED BLOCK - CachyOS"
    block: |
      {% if archrepomanager_cachyos_variant | length > 0 %}
      [cachyos-{{ archrepomanager_cachyos_variant }}]
      Include = /etc/pacman.d/cachyos-{{ archrepomanager_cachyos_mirrorlist_tier }}-mirrorlist
      [cachyos-core-{{ archrepomanager_cachyos_variant }}]
      Include = /etc/pacman.d/cachyos-{{ archrepomanager_cachyos_mirrorlist_tier }}-mirrorlist
      [cachyos-extra-{{ archrepomanager_cachyos_variant }}]
      Include = /etc/pacman.d/cachyos-{{ archrepomanager_cachyos_mirrorlist_tier }}-mirrorlist
      {% endif %}
      [cachyos]
      Include = /etc/pacman.d/cachyos-mirrorlist
    state: present

- name: Refresh pacman databases
  ansible.builtin.pacman:
    update_cache: yes
