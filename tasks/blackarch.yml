---
- name: Ensure curl and gnupg are present (needed for strap.sh)
  community.general.pacman:
    name:
      - curl
      - gnupg
    state: present
    update_cache: true

- name: Download BlackArch strap script
  ansible.builtin.get_url:
    url: "{{ archrepomanager_blackarch_strap_url }}"
    dest: /tmp/blackarch-strap.sh
    mode: '0755'

- name: Run BlackArch strap script
  ansible.builtin.command:
    cmd: /tmp/blackarch-strap.sh
  args:
    creates: /etc/pacman.d/blackarch-mirrorlist

- name: Update pacman database after BlackArch setup
  community.general.pacman:
    update_cache: true
