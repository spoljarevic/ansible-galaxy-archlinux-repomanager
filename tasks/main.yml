# tasks file for archlinux-repomanager

- name: Install CachyOS repository
  ansible.builtin.include_tasks: cachyos.yml
  when: archrepomanager_cachyos_enabled | bool

- name: Install BlackArch repository
  ansible.builtin.include_tasks: blackarch.yml
  when: archrepomanager_blackarch_enabled | bool
